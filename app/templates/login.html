<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyREN &mdash; Sign In</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family:'Space Grotesk',sans-serif; background:#fff8e7; color:#1a1a1a; font-weight:500; }
  .auth-wrap {
    min-height:100vh; display:flex; align-items:center; padding:40px 20px;
    background-image:radial-gradient(#e9ddb6 1.6px, transparent 1.6px);
    background-size:17px 17px;
  }
  .card { border:4px solid #1a1a1a !important; border-radius:10px; box-shadow:6px 6px 0 #1a1a1a; background:#fff; }
  .btn { border:3px solid #1a1a1a !important; border-radius:8px; font-weight:700;
         box-shadow:3px 3px 0 #1a1a1a; font-family:'Space Grotesk',sans-serif; }
  .btn:active { transform:translate(3px,3px); box-shadow:none; }
  .btn-primary { background:#0d2c50 !important; color:#ffd60a !important; }
  .btn-outline-secondary { background:#fff; color:#1a1a1a; }
  .form-control,.form-select,.input-group-text { border:3px solid #1a1a1a; border-radius:8px;
    font-weight:500; font-family:'Space Grotesk',sans-serif; }
  .form-control:focus,.form-select:focus { border-color:#1a1a1a; box-shadow:3px 3px 0 #ffd60a; }
  .alert { border:3px solid #1a1a1a; border-radius:8px; box-shadow:3px 3px 0 #1a1a1a; font-weight:600; }
  .alert-danger { background:#ffc9c9; color:#8a1c1c; }
  .alert-success { background:#b2f2e5; color:#0b5d4d; }
  h3 { font-family:'Archivo Black',sans-serif; }
  .brand-title { font-family:'Archivo Black',sans-serif; color:#0d2c50; letter-spacing:1px; }
  .brand-sub { color:#8a8070; font-weight:600; font-size:.8rem; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="container" style="max-width:430px">

    <div class="text-center mb-4">
      <h1 class="brand-title mb-0">CyREN</h1>
      <div class="brand-sub">SOC INCIDENT RESPONSE</div>
    </div>

    <div class="card">
      <div class="card-body p-4">

        <h3 class="text-center mb-4" style="color:#0d2c50;text-transform:uppercase;letter-spacing:1px">Sign In</h3>

        <div id="loginOk" class="alert alert-success py-2" style="display:none">
          Account created. You can sign in now.
        </div>
        <div id="loginErr" class="alert alert-danger py-2" style="display:none"></div>

        <div class="mb-3">
          <label class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" class="form-control" id="loginUser" autocomplete="username" autofocus>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control" id="loginPw" autocomplete="current-password"
                   onkeydown="if(event.key==='Enter')doLogin()">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePw('loginPw', this)">
              <i class="bi bi-eye-fill"></i>
            </button>
          </div>
        </div>

        <button class="btn btn-primary w-100 py-2" id="loginBtn" onclick="doLogin()">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>

        <hr class="my-4">

        <p class="text-center text-muted small mb-0">
          Do not have an account? <a href="/register">Register here</a>
        </p>
      </div>
    </div>

  </div>
</div>

<script>
  if (new URLSearchParams(location.search).get('registered') === '1') {
    document.getElementById('loginOk').style.display = 'block';
  }

  function togglePw(id, btn) {
    var f = document.getElementById(id);
    var on = f.type === 'password';
    f.type = on ? 'text' : 'password';
    btn.innerHTML = on ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye-fill"></i>';
  }

  function showErr(msg) {
    var el = document.getElementById('loginErr');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function doLogin() {
    var btn = document.getElementById('loginBtn');
    document.getElementById('loginErr').style.display = 'none';
    btn.disabled = true;
    var res;
    try {
      res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('loginUser').value.trim(),
          password: document.getElementById('loginPw').value
        })
      });
    } catch (e) {
      btn.disabled = false;
      showErr('Cannot reach the CyREN server.');
      return;
    }
    var data = await res.json().catch(function () { return {}; });
    btn.disabled = false;
    if (res.ok && data.ok) {
      location.href = '/';
    } else {
      showErr(data.error || 'Invalid username or password.');
    }
  }
</script>
</body>
</html>
